[workspace]
preview = ["pixi-build"]
authors = ["kaitlyn-kobayashi <kaitlynshizuko-mary.kobayashi@uhn.ca>"]
channels = ["conda-forge"]
name = "BiomedParse"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "==3.10.14"
packaging = "==23.0"
setuptools = "==65.6.3"
pandas = "==2.2.2"
scikit-learn = "==1.4.2"
hydra-core = "==1.3.2"
marshmallow = "==3.23.2"
transformers = "==4.40.0"
sentencepiece = "==0.2.0"
python-dotenv = "==1.0.1"
azure-ai-ml = "==1.16.1"
ipykernel = ">=7.1.0,<8"
pip = ">=25.3,<26"
scikit-image = "==0.24.0"
scipy = "==1.11.2"
click = ">=8.3.1,<9"
huggingface_hub = ">=0.36.0,<0.37"
simplejson = ">=3.20.2,<4"
seaborn = ">=0.13.2,<0.14"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu124"]
no-build-isolation = ["detectron2"]

[pypi-dependencies]
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git", rev = "5b72c27ae39f99db75d43f18fd1312e1ea934e60"}
torch = "==2.6.0+cu124"
torchvision = "==0.21.0+cu124"
torchaudio = "==2.6.0+cu124"
ninja = "==1.11.1.1"
lightning = "==2.3.0"
timm = "==0.9.16"
deepspeed = "==0.14.2"
open-clip-torch = "==2.26.1"
kornia = "==0.7.3"
azureml-acft-image-components = { version = "==0.0.79", extras = ["olympus"] }
opencv-python = ">=4.11.0.86, <5"
med-imagetools = ">=2.12.2, <3"
monai = ">=1.5.1, <2"
damply = ">=0.9.0, <0.10"
